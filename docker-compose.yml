services:
  mihomo:
    image: metacubex/mihomo:latest
    container_name: mihomo-lan
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-7890}:7890"
      - "${SOCKS_PORT:-7891}:7891"
      - "${CONTROLLER_PORT:-9090}:9090"
    volumes:
      - ./config:/root/.config/mihomo
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
