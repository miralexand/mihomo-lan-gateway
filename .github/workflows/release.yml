name: Build & Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Fetch mihomo core
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mihomo.ps1 -Proxy ""

      - name: Fetch panel UI
        shell: pwsh
        env:
          MIHOMO_UI_URL: https://github.com/MetaCubeX/metacubexd/releases/latest/download/compressed-dist.tgz
        run: ./scripts/fetch-ui.ps1

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: desktop
        run: npm version "${{ github.ref_name }}".TrimStart('v') --no-git-tag-version --allow-same-version

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build
        working-directory: desktop
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MihomoGateway-windows-x64
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
